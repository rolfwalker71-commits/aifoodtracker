services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aifood
      POSTGRES_PASSWORD: aifood
      POSTGRES_DB: aifoodtracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aifood -d aifoodtracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # Von GitHub Container Registry pullen:
    #   docker compose pull
    #   docker compose up -d
    # Lokal neu bauen (optional):
    #   docker compose up -d --build
    image: ghcr.io/rolfwalker71-commits/aifoodtracker:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3333:3333"
    env_file:
      - .env
    environment:
      PORT: 3333
      HOSTNAME: 0.0.0.0
      # Muss mit dem Volume-Mount übereinstimmen – sonst gehen Bilder bei jedem Redeploy verloren.
      UPLOAD_DIR: /app/uploads
      DATABASE_URL: postgresql://aifood:aifood@db:5432/aifoodtracker?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me-in-production-aifoodtracker-32}
      AUTH_URL: ${AUTH_URL:-http://localhost:3333}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3333}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-aifoodtracker-dev-encryption-key-32b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:hello@example.com}
      CRON_SECRET: ${CRON_SECRET:-dev-cron-secret}
    volumes:
      # Bind-Mount auf dem Host – überlebt Image-Pulls und Container-Recreates.
      # Niemals `docker compose down -v` nutzen (löscht DB + Uploads).
      # Vor dem ersten Start: mkdir -p data/uploads
      - ./data/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  push-cron:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    depends_on:
      - app
    environment:
      CRON_SECRET: ${CRON_SECRET:-dev-cron-secret}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 20
        while true; do
          curl -fsS -X POST -H "Authorization: Bearer $$CRON_SECRET" http://app:3333/api/cron/push || true
          sleep 60
        done

volumes:
  postgres_data:
