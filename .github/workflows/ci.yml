name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aifood
          POSTGRES_PASSWORD: aifood
          POSTGRES_DB: aifoodtracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aifood -d aifoodtracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://aifood:aifood@localhost:5432/aifoodtracker?schema=public
      AUTH_SECRET: ci-auth-secret-aifoodtracker-32chars
      AUTH_URL: http://localhost:3333
      NEXTAUTH_URL: http://localhost:3333
      ENCRYPTION_KEY: ci-encryption-key-aifoodtracker-32
      OPENAI_API_KEY: ""
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
